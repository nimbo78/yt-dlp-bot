[project]
name = "app_bot"
version = "0.1.0"
requires-python = ">=3.12"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "pyrofork>=2.3.56",
    "pyyaml>=6.0.2",
    "ruamel.yaml>=0.18.0",
    "tenacity>=9.0.0",
    "tgcrypto-pyrofork>=1.2.7",
]

[tool.pytest.ini_options]
# Tests import the package the way the application does, and reach yt_shared
# from the sibling directory the Dockerfile copies in.
pythonpath = [".", "../yt_shared/src"]
testpaths = ["tests"]
# Coroutines are marked one by one rather than collected wholesale, so an
# accidentally-async test cannot pass by never being awaited.
asyncio_mode = "strict"
