# Where RabbitMQ starts pushing back, merged into the image's own config.
#
# Cuttlefish format, so comments are `#`. The `enabled_plugins` file next to
# this one is Erlang terms and uses `%%` — they are not the same format, and
# using the wrong comment character here is a hard boot failure, not a warning.
#
# This is not a limit on what RabbitMQ uses. It is the point at which it blocks
# publishers so it stops growing — which is why setting it below what the broker
# actually needs is worse than leaving it alone: the bot would hang trying to
# queue a download.
#
# Measured on the host this fork is developed against: 70 MiB at rest, with the
# management plugin and three queues. The messages are small JSON payloads and
# the stack tops out at a couple of simultaneous downloads, so this is a bit
# under three times the resting figure — headroom for a backlog that this
# workload cannot realistically produce, and half of the 40%-of-host default
# that a small machine cannot afford to hand to a broker.
#
# Written in bytes rather than `192MiB` on purpose: which unit suffixes parse is
# one more thing to be wrong about, and there is nothing to get wrong about an
# integer. 192 * 1024 * 1024 = 201326592.
#
# On a larger host, raise it or switch to a proportion:
#   vm_memory_high_watermark.relative = 0.4
# The value in effect is announced in the log on every boot, so it is always
# checkable: "Memory high watermark set to ...".
vm_memory_high_watermark.absolute = 201326592
