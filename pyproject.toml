[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
src = [
    "app_api",
    "app_bot",
    "app_worker"
]
required-version = ">=0.9"
extend-exclude = [
    # One-off tooling that generates README artwork, not part of any service.
    "assets/readme/source",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Test code is held to different conventions than the code it exercises:
# asserting is the point, reaching into a module's internals is often the only
# way to pin behaviour down, and a literal in a table of cases is clearer named
# than not.
"**/tests/**" = [
    "ANN001",   # fixtures and parameters are typed where it helps, not everywhere
    "ARG001",   # a fixture requested only for its effect looks unused
    "ARG002",
    "D205",
    "D209",
    "D404",
    "FBT003",   # a boolean argument in a table of cases reads fine
    "PLC0415",  # a local import keeps a single test's dependency where it is used
    "PLR2004",  # the literals are the cases
    "PT011",    # broad `pytest.raises` where the message is asserted separately
    "PT018",    # a composite assertion is sometimes the clearest one
    "RUF001",   # yt-dlp writes typographic apostrophes; the samples must too
    "S101",     # assert
    "SLF001",   # private members are exactly what several of these pin down
]

[tool.ruff.lint]
select = ["ALL"]
# Rules that graduate from preview into a stable ruff release land here too, so
# a new ruff must be tried against the tree before the pin in CI is moved.
ignore = [
    "ANN002",
    "ANN003",
    "ANN401",
    "ASYNC110",
    "BLE001",
    "COM812",
    "CPY001",   # no copyright header on every file, thanks
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "E501",
    "EM101",
    "EM102",
    "FAST002",
    "FBT001",
    "FBT002",
    "FIX002",
    "INP001",
    "ISC001",
    # A long message wrapped across two lines is written as implicit
    # concatenation throughout, including inside the pattern and sample tables.
    # The rule guards against a comma missing from a list of short literals,
    # which is not the shape any of these have.
    "ISC004",
    "PERF401",
    # The sibling of PLR0913, which the handful of wide signatures already
    # acknowledge where they are declared. Ignored globally rather than added to
    # those `noqa` comments, which would read as unused on a ruff that still
    # keeps this rule in preview.
    "PLR0917",
    "TD002",
    "TD003",
    "TRY003",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"
docstring-code-format = true

[tool.pylint]
init-hook = "import sys; sys.path.append('./yt_shared')"

[tool.mypy]
mypy_path = [
    "app_bot",
    "app_api",
    "app_worker"
]
explicit_package_bases = true
namespace_packages = true

[tool.uv.sources]
yt-shared = { path = "yt_shared" }
app-api = { path = "app_api" }
app-bot = { path = "app_bot" }
app-worker = { path = "app_worker" }

[project]
name = "yt-dlp-bot"
version = "0.1.0"
requires-python = ">=3.12"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "app-api",
    "app-bot",
    "app-worker",
    "yt-shared",
]

[dependency-groups]
lint = [
    "ruff>=0.9.4",
]
