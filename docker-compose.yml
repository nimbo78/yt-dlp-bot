services:
  base-image:
    image: yt-base-image
    build:
      dockerfile: base.Dockerfile
    deploy:
      mode: replicated
      replicas: 0
  yt_api:
    container_name: yt_api
    build:
      context: .
      dockerfile: app_api/Dockerfile
    env_file:
      - envs/common.env
      - envs/api.env
      # Your own settings. Tracked files above hold the shipped defaults and are
      # meant to stay untouched, so that `git pull` never collides with them;
      # anything you set here wins. Optional — see envs/README.md.
      - path: envs/common.local.env
        required: false
      - path: envs/api.local.env
        required: false
    restart: unless-stopped
    ports:
      # Bound to the host: the API queues downloads into your chats, and it
      # is unauthenticated until API_TOKEN is set. Publish it more widely in
      # docker-compose.override.yml once a token is in place.
      - "127.0.0.1:1984:8000"
    command: bash -c "python start.py && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
      - yt_worker
      - yt_redis
  yt_bot:
    container_name: yt_bot
    build:
      context: .
      dockerfile: app_bot/Dockerfile
    env_file:
      - envs/common.env
      - envs/bot.env
      - path: envs/common.local.env
        required: false
      - path: envs/bot.local.env
        required: false
    restart: unless-stopped
    command: >
      bash -c "python start.py && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
      - yt_worker
      - yt_api
    volumes:
      - "shared-tmpfs:/tmp/download_tmpfs"
      - "./app_bot/config.yml:/app/config.yml"  # Mount config for hot-reload
  yt_worker:
    container_name: yt_worker
    build:
      context: .
      dockerfile: app_worker/Dockerfile
    env_file:
      - envs/common.env
      - envs/worker.env
      - path: envs/common.local.env
        required: false
      - path: envs/worker.local.env
        required: false
    restart: unless-stopped
    command: >
      bash -c "python start.py && alembic upgrade head && python main.py"
    depends_on:
      - yt_postgres
      - yt_rabbitmq
    volumes:
      - "/data/downloads:/filestorage"
      - "shared-tmpfs:/tmp/download_tmpfs"
  yt_postgres:
    container_name: yt_postgres
    image: "postgres:15"
    env_file:
      - envs/common.env
      - path: envs/common.local.env
        required: false
    ports:
      - "5435:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
  yt_rabbitmq:
    image: "rabbitmq:3.12-management-alpine"
    container_name: yt_rabbitmq
    ports:
      - "25672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      # Drops rabbitmq_prometheus, which nothing here scrapes. See the file.
      - "./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"
  yt_redis:
    # Pinned to the 7 series on purpose. `redis:alpine` moved to Redis 8, which
    # bundles RedisBloom, RediSearch, RedisTimeSeries and ReJSON into the base
    # image and loads all four at startup — RediSearch spins up its own thread
    # pool. Redis is used in exactly one place here, as the fastapi-cache
    # backend in `app_api/api/app.py`: GET and SET with a TTL, and not one of
    # those four is involved. The major is pinned and the patch level is not,
    # so security fixes still arrive.
    image: "redis:7-alpine"
    container_name: yt_redis
    restart: unless-stopped
    # A cache with no volume, so nothing here is worth keeping and unbounded
    # growth is the only real risk. LRU eviction inside 64 MB is what a cache
    # is supposed to do; without a maxmemory it would simply grow.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]

volumes:
  pgdata:
  shared-tmpfs:
    driver: local
    # Staging area for in-flight downloads. This is a tmpfs, so it lives in RAM:
    # keep the size below the memory the host can actually spare, or the first
    # large download will push the machine into swap. See the README section on
    # running with limited resources.
    driver_opts:
      type: "tmpfs"
      device: "tmpfs"
      o: "size=7168m,uid=1000"
