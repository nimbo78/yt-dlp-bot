name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only what the tests themselves import. The application packages are not
      # installed: the tests exercise pure functions and one FastAPI dependency
      # in isolation, so pulling in Pyrogram, yt-dlp, SQLAlchemy and the rest
      # would cost minutes and add failure modes that say nothing about this
      # repository.
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8' \
            'pytest-asyncio>=0.23' \
            'ruff>=0.9' \
            'pydantic>=2.10' \
            'pydantic-settings>=2.7' \
            'pyyaml>=6' \
            'ruamel.yaml>=0.18' \
            'fastapi>=0.115' \
            'httpx>=0.27'

      - name: Lint
        run: ruff check --output-format=github .

      # Each package carries its own pytest configuration, including the paths
      # it needs on sys.path, so they are run separately rather than as one tree.
      - name: Test app_bot
        working-directory: app_bot
        run: python -m pytest -q

      - name: Test app_worker
        working-directory: app_worker
        run: python -m pytest -q

      - name: Test app_api
        working-directory: app_api
        run: python -m pytest -q

      - name: Test yt_shared
        working-directory: yt_shared
        run: python -m pytest -q
